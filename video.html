<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Video Blog</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <nav>

        <a href="index.html">Home.</a>

        <a href="about.html">About Me.</a>

        <a href="blog.html">Blog.</a>

        <a href="video.html">Video.</a>

    </nav>


    <main class="page">


        <h1 class="big-title">

            video blog

        </h1>


        <div class="video-date">

            September 7, 2026

        </div>


        <!-- VIDEO CARD -->

        <section class="video-card">


            <video
                id="videoPlayer"
                controls>
            </video>


            <!-- PLACEHOLDER -->

            <div
                class="video-placeholder"
                id="videoPlaceholder">


                <div class="play-circle">

                    <div class="play-triangle"></div>

                </div>


                <p>

                    Press to Play Video

                </p>


            </div>


        </section>


        <!-- VIDEO INSERT -->

        <section class="video-upload">


            <label
                for="videoInput"
                class="upload-label">

                <span>

                    Insert video file and post

                </span>


                <span>

                    ↗

                </span>


            </label>


            <input
                type="file"
                id="videoInput"
                accept="video/*"
                onchange="loadVideo(event)">


        </section>


    </main>


    <script src="script.js"></script>


</body>

</html>
